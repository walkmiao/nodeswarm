name: NodeSwarm CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit tests
        run: go test ./... -count=1
      - name: Static checks
        run: go vet ./...
      - name: Frontend syntax
        if: runner.os == 'Linux'
        run: node --check web/app.js
      - name: UI design audit
        if: runner.os == 'Linux'
        run: |
          python3 scripts/audit_ui.py
          node --check desktop/frontend/dist/app.js
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - name: Build Linux integration test binary
        if: runner.os == 'Linux'
        run: go build -trimpath -o node-console-linux-amd64 .
      - name: Real Controller / Agent / SOCKS5 smoke
        if: runner.os == 'Linux'
        run: python3 scripts/e2e_smoke.py

  artifacts:
    name: Cross-platform binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Linux and Windows
        run: make all
      - name: Checksum
        run: sha256sum node-console-linux-amd64 node-console-linux-arm64 node-console-windows-amd64.exe nodeswarm-client-windows-amd64.exe > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nodeswarm-binaries
          path: |
            node-console-linux-amd64
            node-console-linux-arm64
            node-console-windows-amd64.exe
            nodeswarm-client-windows-amd64.exe
            SHA256SUMS
          retention-days: 14
